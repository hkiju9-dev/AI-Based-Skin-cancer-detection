{% load static %}
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>

  <link rel="stylesheet" href="{% static 'css/css/login.css' %}">
  <link rel="stylesheet" href="{% static 'css/Register.css' %}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <script type="text/javascript" src="{% static 'js/Register.js' %}" defer></script>

  <style>

.message-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: 300px;
    text-align: center;
}

.success {
    background-color: #e6ecf5;
    color: navy;
    border: 1px solid navy;
    padding: 10px;
    border-radius: 5px;
}

.error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
    padding: 10px;
    border-radius: 5px;
}

:root {
  --accent-color: navy;
  --base-color: white;
  --text-color: #2E2B41;
  --input-color: #F3F0FF;
}

* {
  margin: 0;
  padding: 0;
}

html {
  font-family: Poppins, Segoe UI, sans-serif;
  font-size: 12pt;
  color: var(--text-color);
  text-align: center;
}

body {
  min-height: 100vh;
  background-image: url("{% static 'css/img/3737510.jpg' %}");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.wrapper {
  box-sizing: border-box;
  background-color: var(--base-color);
  height: 100vh;
  width: max(40%, 600px);
  padding: 10px;
  border-radius: 0 20px 20px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  font-size: 3rem;
  font-weight: 900;
  text-transform: uppercase;
}

form {
  width: min(400px, 100%);
  margin-top: 20px;
  margin-bottom: 50px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

form > div {
  width: 100%;
  display: flex;
  justify-content: center;
}

.input-group span {
  flex-shrink: 0;
  height: 50px;
  width: 50px;
  background-color: var(--accent-color);
  color: white;
  border-radius: 10px 0 0 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 1.5rem;
}

form input {
  box-sizing: border-box;
  flex-grow: 1;
  min-width: 0;
  height: 50px;
  padding: 1em;
  font: inherit;
  border-radius: 0 10px 10px 0;
  border: 2px solid var(--input-color);
  border-left: none;
  background-color: var(--input-color);
  transition: 150ms ease;
}

form input:hover {
  border-color: var(--accent-color);
}

form input:focus {
  outline: none;
  border-color: var(--text-color);
}

::placeholder {
  color: black !important;
}

.form-checkbox {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 14px;
}

.form-checkbox input[type="checkbox"] {
  margin: 0;
}

.form-checkbox span {
  font-size: 16px;
  cursor: pointer;
}

form button {
  margin-top: 10px;
  border: none;
  border-radius: 1000px;
  padding: .85em 4em;
  background-color: navy;
  color: white;
  font: inherit;
  font-weight: 600;
  text-transform: uppercase;
  cursor: pointer;
  transition: 150ms ease;
}

form button:hover {
  background-color: #001f3f !important;
}

form button:focus,
form button:active {
  background-color: #001f3f !important;
  outline: none;
}

a {
  color: #001f3f;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

@media(max-width: 1100px){
  .wrapper{
    width: min(600px, 100%);
    border-radius: 0;
  }
}

form div.incorrect label{
  background-color: #721c24;
}

form div.incorrect input{
  border-color: #721c24;
}

#error-message{
  color:#721c24;
}

  </style>
</head>

<body>

{% if messages %}
<div class="message-container">
    {% for message in messages %}
        <div class="{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
</div>

<script>
setTimeout(function() {
    const messageContainer = document.querySelector('.message-container');
    if (messageContainer) {
        messageContainer.style.display = 'none';
    }
}, 3000);
</script>
{% endif %}

<div class="wrapper">

    <h1>Register</h1>

    <p id="error-message"></p>

    <form action="{% url 'Register' %}" method="POST">
        {% csrf_token %}

        <div class="mb-3 input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            {{ form.username }}
        </div>

        <div class="mb-3 input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            {{ form.email }}
        </div>

        <div class="mb-3 input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            {{ form.password1 }}
        </div>

        <div class="mb-3 input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            {{ form.password2 }}
        </div>

        <div class="form-checkbox">
          <input type="checkbox" id="terms-checkbox" required>
          <span>I agree to the <a href="/terms" target="_blank">Terms and Conditions</a></span>
        </div>

        <button type="submit" class="w-100"
  style="background-color: navy; color: white; border-radius: 1000px; padding: .85em 4em; font-weight: 600; text-transform: uppercase; border: none; cursor: pointer; transition: 150ms ease;">
  Register Now
</button>

    </form>

    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>

</div>

</body>
</html>
