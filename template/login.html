<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <style>
.message-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: 300px;
    text-align: center;
}

.success {
    background-color: #e6ecf5;
    color: navy;
    border: 1px solid navy;
    padding: 10px;
    border-radius: 5px;
}

.error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
    padding: 10px;
    border-radius: 5px;
}
</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'css/css/login.css' %}">

   <!-- Bootstrap CSS (via CDN) -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJ01TtrqYxq8kc7N7I3xu2K+Evs8hP8CgNlcV0z1AdnvvPOVYlwhMwKyFGzQ" crossorigin="anonymous">
  <script type="text/javascript" src="{% static 'java/Register.js' %}" defer></script>
</head>
<body>
{% if messages %}
        <div class="message-container">
            {% for message in messages %}
                <div class="{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        <script>
            setTimeout(function() {
                const messageContainer = document.querySelector('.message-container');
                if (messageContainer) {
                    messageContainer.style.display = 'none';
                }
            }, 3000); // 3000 milliseconds = 3 seconds
        </script>
    {% endif %}
  <div class="wrapper">
    <h1>Login</h1>
    <p id="error-message"></p>
    <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}
      <div>
        <label for="username">
          <span>@</span>

        </label>
        <input type="text" name="username" id="username" placeholder="username">
      </div>
      <div>
        <label for="password-input">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm240-200q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/></svg>
        </label>
        <input type="password" name="password" id="password-input" placeholder="Password">
      </div>
      <!-- Terms and Conditions Checkbox -->



      <p><a href="/Forgotpass">Forget Password?</a></p>

      <button type="submit">Login</button>

    </form>
    <p>New here? <a href="/Register">Create an Account</a></p>
  </div>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.querySelector("form");
    const passwordInput = document.getElementById("password-input");
    const usernameInput = document.getElementById("username");
    const errorMessage = document.getElementById("error-message");

    let existingUsernames = [];

    // Fetch existing usernames from Django


    form.addEventListener("submit", function(event) {
        const password = passwordInput.value;
        const username = usernameInput.value.trim();
        let errors = [];

        // Check if username is empty
        if (username === "") {
            errors.push("Username cannot be empty.");
        }

        // Check if username already exists

if (password === "") {
            errors.push("password cannot be empty.");
        }
        // Password validation rules
        if (password.length < 8) {
            errors.push("Password must be at least 8 characters long.");
        }
        if (!/[A-Z]/.test(password)) {
            errors.push("Password must contain at least one uppercase letter.");
        }
        if (!/[a-z]/.test(password)) {
            errors.push("Password must contain at least one lowercase letter.");
        }
        if (!/[0-9]/.test(password)) {
            errors.push("Password must contain at least one number.");
        }

        if (errors.length > 0) {
            event.preventDefault();  // Stop form submission
            errorMessage.innerHTML = errors.join("<br>");
            errorMessage.style.color = "red";
        } else {
            errorMessage.innerHTML = ""; // Clear error messages if valid
        }
    });
});
</script>

</body>
</html>
