

<html lang="en">
{% load static %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>

  <!-- Link to your existing CSS file -->
  <link rel="stylesheet" href="{% static 'css/css/login.css' %}">

  <!-- Bootstrap CSS (as per your original code) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KyZXEJ01TtrqYxq8kc7N7I3xu2K+Evs8hP8CgNlcV0z1AdnvvPOVYlwhMwKyFGzQ" crossorigin="anonymous">

  <!-- JavaScript file -->
  <script type="text/javascript" src="{% static 'js/ForgotPassword.js' %}" defer></script>
</head>
<body>
  <div class="wrapper">
    <h1>Forgot Password</h1>
    <p>Enter your email address below, and we will send you instructions to reset your password.</p>

    <!-- Django password reset form -->
    <form method="POST" action="{% url 'reset_password' %}">
      {% csrf_token %}
      <div>
        <label for="email-input">
          <span>@</span>
        </label>
        <input type="email" name="email" id="email-input" placeholder="Email" required>
      </div>
      <button type="submit">Send Reset Instructions</button>
    </form>

    <p><a href="{% url 'login' %}">Back to Login</a></p>
  </div>
</body>
</html>
