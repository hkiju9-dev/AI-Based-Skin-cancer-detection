

{% block content %}

<style>
/* Container Styling */
.change-password-container {
    max-width: 500px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    text-align: center;
}

/* Title Styling */
.change-password-container h4 {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
    color: #333;
}

/* Form Styling */
.change-password-form .form-group {
    margin-bottom: 15px;
    text-align: left;
}

.change-password-form label {
    font-weight: bold;
    font-size: 14px;
    color: #555;
}

.change-password-form input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 14px;
}

/* Button Styling */
.btn-change-password {
    background: #1acc8d; /* Pink theme */
    color: white;
    padding: 12px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    width: 100%;
    cursor: pointer;
    transition: 0.3s ease;
}

.btn-change-password:hover {
    background:#4ae0a8; /* Darker pink */
}

/* Responsive Design */
@media (max-width: 768px) {
    .change-password-container {
        width: 90%;
    }
}
</style>

<div class="change-password-container">
    <h4>Change Password</h4>
    <hr>

    <form method="POST" action="{% url 'change_password' %}" class="change-password-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="current_password">Current Password</label>
            <input type="password" name="current_password" id="current_password" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" name="new_password" id="new_password" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
        </div>

        <button type="submit" class="btn-change-password">Update Password</button>
    </form>
</div>

{% endblock %}
